name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend
        run: docker build -t rishantsingh/devops-frontend ./frontend

      - name: Build Backend
        run: docker build -t rishantsingh/devops-backend ./backend

      - name: Push Frontend
        run: docker push rishantsingh/devops-frontend

      - name: Push Backend
        run: docker push rishantsingh/devops-backend